<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, interactive-widget=resizes-content">
  <meta name="theme-color" content="#0b0e13">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="PWA Base">
  <meta name="description" content="移动端 PWA 可插拔模块化架构与多模型 API 网关通用底座">
  <title>Modular PWA Base</title>
  <link rel="manifest" href="./manifest.json">
  <link rel="icon" type="image/png" href="./icon-192.png">
  <link rel="apple-touch-icon" href="./icon-192.png">
  <link rel="stylesheet" href="./styles/main.css">
</head>
<body>
  <div id="app-shell" class="app-shell">
    <!-- Section 1: Top Fixed Status Bar (Commander + Quick Actions + 6-Resource Strip) -->
    <header class="app-header" id="app-top-header">
      <div class="top-header-row">
        <button type="button" id="btn-top-commander" class="top-cmd-pill" aria-label="指挥官资料">
          <img id="top-cmd-avatar" class="top-cmd-avatar" src="" alt="指挥官" hidden>
          <span id="top-cmd-fallback" class="brand-mark" aria-hidden="true">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none">
              <circle cx="12" cy="12" r="9" stroke="#14b8a6" stroke-width="2"/>
              <path d="M12 6V17M8.5 10H15.5M7 14C7 16.8 9.2 18.5 12 18.5C14.8 18.5 17 16.8 17 14" stroke="#2dd4bf" stroke-width="1.8" stroke-linecap="round"/>
            </svg>
          </span>
          <div class="brand-titles">
            <span id="top-cmd-summary" class="app-title">港区指挥官 Lv.1</span>
            <span id="active-module-name" class="active-module-name">加载中...</span>
          </div>
        </button>

        <nav class="header-actions" aria-label="系统入口">
          <button type="button" id="btn-open-theme" class="header-btn" aria-label="主题与倍率">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <circle cx="13.5" cy="6.5" r=".5" fill="currentColor"/>
              <circle cx="17.5" cy="10.5" r=".5" fill="currentColor"/>
              <circle cx="8.5" cy="7.5" r=".5" fill="currentColor"/>
              <path d="M12 2C6.5 2 2 6.5 2 12s4.5 10 10 10c.93 0 1.65-.75 1.65-1.69 0-.43-.18-.83-.44-1.12-.29-.29-.44-.65-.44-1.12a1.64 1.64 0 0 1 1.67-1.67h2c3.05 0 5.56-2.5 5.56-5.55C21.97 6.01 17.46 2 12 2Z"/>
            </svg>
            <span>主题</span>
          </button>
          <button type="button" id="btn-open-vault" class="header-btn" aria-label="存档保险箱">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z"/>
              <polyline points="17 21 17 13 7 13 7 21"/>
              <polyline points="7 3 7 8 15 8"/>
            </svg>
            <span>存档</span>
          </button>
          <button type="button" id="btn-return-title" class="header-btn" aria-label="返回封面">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <path d="M3 10.5 12 3l9 7.5"/>
              <path d="M5 10v10h14V10"/>
            </svg>
            <span>封面</span>
          </button>
          <button type="button" id="btn-open-modules" class="header-btn is-icon-compact" aria-label="系统工具" title="模块/API/数据">
            <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <circle cx="12" cy="12" r="3"/>
              <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9c.26.604.852.997 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/>
            </svg>
          </button>
          <button type="button" id="btn-open-api" hidden aria-hidden="true"></button>
          <button type="button" id="btn-open-data" hidden aria-hidden="true"></button>
        </nav>
      </div>

      <!-- Compact 6-Resource Live Status Bar (油/弹/钢/铝/银条/金条) -->
      <div id="top-resource-strip" class="top-resource-strip" aria-label="港区资源概览"></div>
    </header>

    <!-- Hidden legacy nav strip placeholder kept for graceful backward compatibility -->
    <nav id="module-nav-strip" class="module-nav-strip" hidden aria-hidden="true"></nav>

    <!-- Section 2: Unified Central Immersive Main Stage (65%~75% viewport height) -->
    <main id="app-stage" class="app-stage is-unified-stage" data-stage-mode="theatre" aria-live="polite"></main>

    <!-- Section 3: Bottom Fixed Thumb-Friendly Navigation Bar + Compact Optional Input -->
    <footer class="app-footer" id="app-bottom-footer">
      <div id="quick-actions-slot" class="quick-actions-slot" role="toolbar" aria-label="模块快捷按钮" hidden></div>
      <form id="universal-input-form" class="input-bar" autocomplete="off">
        <textarea
          id="universal-input"
          class="universal-input"
          rows="1"
          placeholder="和秘书舰聊聊或输入指令..."
          aria-label="通用输入框"
        ></textarea>
        <button type="submit" id="btn-universal-send" class="btn-send" aria-label="发送消息">
          <span>发送</span>
        </button>
      </form>
      <nav id="bottom-tab-bar" class="bottom-tab-bar is-four-col" aria-label="底部主导航" data-no-swipe="true">
        <button type="button" class="bottom-tab-btn is-active" data-bottom-nav="port-hub">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 19.5v-15A2.5 2.5 0 0 1 6.5 2H20v20H6.5a2.5 2.5 0 0 1 0-5H20"/></svg>
          <span>剧场港区</span>
        </button>
        <button type="button" class="bottom-tab-btn" data-bottom-nav="sortie-console">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polygon points="3 11 22 2 13 21 11 13 3 11"/></svg>
          <span>出征海图</span>
        </button>
        <button type="button" class="bottom-tab-btn" data-bottom-nav="port-formation">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>
          <span>舰队编成</span>
        </button>
        <button type="button" class="bottom-tab-btn" data-bottom-nav="supply-workshop">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m7.5 4.27 9 5.15"/><path d="M21 8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16Z"/><path d="m3.3 7 8.7 5 8.7-5"/><path d="M12 22V12"/></svg>
          <span>仓库图鉴</span>
        </button>
      </nav>
    </footer>
  </div>

  <!-- Centered Frosted-Glass Tactical Modal (Theme / Save Vault / System Tools) -->
  <div id="sheet-backdrop" class="sheet-backdrop uikit-tactical-backdrop is-shell-tactical" hidden>
    <section
      id="sheet-dialog"
      class="sheet-dialog uikit-tactical-modal is-shell-tactical"
      role="dialog"
      aria-modal="true"
      aria-labelledby="sheet-title"
    >
      <header class="sheet-header uikit-tactical-header">
        <h2 id="sheet-title" class="sheet-title uikit-tactical-title">设置</h2>
        <button type="button" id="btn-sheet-close" class="btn-icon-close" aria-label="关闭弹窗">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true">
            <path d="M18 6 6 18"/>
            <path d="m6 6 12 12"/>
          </svg>
        </button>
      </header>
      <div id="sheet-body" class="sheet-body uikit-tactical-body"></div>
    </section>
  </div>

  <!-- Top Slide-Down Auto-Fade Toast Region -->
  <div id="toast-region" class="toast-region" aria-live="polite" aria-atomic="true"></div>

  <script type="module" src="./src/main.js"></script>
</body>
</html>
