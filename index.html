<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, interactive-widget=resizes-content">
  <meta name="theme-color" content="#0b0e13">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="PWA Base">
  <meta name="description" content="移动端 PWA 可插拔模块化架构与多模型 API 网关通用底座">
  <title>Modular PWA Base</title>
  <link rel="manifest" href="./manifest.json">
  <link rel="icon" type="image/png" href="./icon-192.png">
  <link rel="apple-touch-icon" href="./icon-192.png">
  <link rel="stylesheet" href="./styles/main.css">
  <link rel="stylesheet" href="./styles/v27-layout.css">
</head>
<body>
  <div id="app-shell" class="app-shell">
    <!-- Section 1: Streamlined Top Fixed Status Bar (Commander + Theme/Save + 6-Resource Strip) -->
    <header class="app-header" id="app-top-header">
      <div class="top-header-row">
        <button type="button" id="btn-top-commander" class="top-cmd-pill" aria-label="前往档案与指挥官资料">
          <img id="top-cmd-avatar" class="top-cmd-avatar" src="" alt="指挥官" hidden>
          <span id="top-cmd-fallback" class="brand-mark" aria-hidden="true">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none">
              <circle cx="12" cy="12" r="9" stroke="#14b8a6" stroke-width="2"/>
              <path d="M12 6V17M8.5 10H15.5M7 14C7 16.8 9.2 18.5 12 18.5C14.8 18.5 17 16.8 17 14" stroke="#2dd4bf" stroke-width="1.8" stroke-linecap="round"/>
            </svg>
          </span>
          <div class="brand-titles">
            <span id="top-cmd-summary" class="app-title">港区指挥官 Lv.1</span>
            <span id="active-module-name" class="active-module-name">加载中...</span>
          </div>
        </button>

        <nav class="header-actions" aria-label="系统入口">
          <button type="button" id="btn-open-theme" class="header-btn" aria-label="主题与倍率">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <circle cx="13.5" cy="6.5" r=".5" fill="currentColor"/>
              <circle cx="17.5" cy="10.5" r=".5" fill="currentColor"/>
              <circle cx="8.5" cy="7.5" r=".5" fill="currentColor"/>
              <path d="M12 2C6.5 2 2 6.5 2 12s4.5 10 10 10c.93 0 1.65-.75 1.65-1.69 0-.43-.18-.83-.44-1.12-.29-.29-.44-.65-.44-1.12a1.64 1.64 0 0 1 1.67-1.67h2c3.05 0 5.56-2.5 5.56-5.55C21.97 6.01 17.46 2 12 2Z"/>
            </svg>
            <span>主题</span>
          </button>
          <button type="button" id="btn-open-vault" class="header-btn" aria-label="存档保险箱">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z"/>
              <polyline points="17 21 17 13 7 13 7 21"/>
              <polyline points="7 3 7 8 15 8"/>
            </svg>
            <span>存档</span>
          </button>
          <button type="button" id="btn-return-title" hidden aria-hidden="true"></button>
          <button type="button" id="btn-open-modules" hidden aria-hidden="true"></button>
          <button type="button" id="btn-open-api" hidden aria-hidden="true"></button>
          <button type="button" id="btn-open-data" hidden aria-hidden="true"></button>
        </nav>
      </div>

      <!-- Compact 6-Resource Live Status Bar (油/弹/钢/铝/银/金) -->
      <div id="top-resource-strip" class="top-resource-strip" aria-label="港区资源概览"></div>
    </header>

    <!-- Hidden legacy nav strip placeholder kept for graceful backward compatibility -->
    <nav id="module-nav-strip" class="module-nav-strip" hidden aria-hidden="true"></nav>

    <!-- Section 2: Unified Central Immersive Main Stage -->
    <main id="app-stage" class="app-stage is-unified-stage" data-stage-mode="theatre" aria-live="polite"></main>

    <!-- Section 3: Bottom Fixed 5-Tab Navigation Bar + Tab-1-Only Chat Input -->
    <footer class="app-footer" id="app-bottom-footer">
      <div id="quick-actions-slot" class="quick-actions-slot" role="toolbar" aria-label="模块快捷按钮" hidden></div>
      <form id="universal-input-form" class="input-bar" autocomplete="off">
        <textarea
          id="universal-input"
          class="universal-input"
          rows="1"
          placeholder="和她聊聊今日港区见闻，或发送消息..."
          aria-label="聊天输入框"
        ></textarea>
        <button type="submit" id="btn-universal-send" class="btn-send" aria-label="发送消息">
          <span>发送</span>
        </button>
      </form>
      <nav id="bottom-tab-bar" class="bottom-tab-bar is-five-col" aria-label="底部五屏主导航" data-no-swipe="true">
        <button type="button" class="bottom-tab-btn is-active" data-bottom-nav="port-hub">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>
          <span>互动</span>
        </button>
        <button type="button" class="bottom-tab-btn" data-bottom-nav="character-console">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M19 21v-2a4 4 0 0 0-4-4H9a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
          <span>档案</span>
        </button>
        <button type="button" class="bottom-tab-btn" data-bottom-nav="sortie-console">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polygon points="3 11 22 2 13 21 11 13 3 11"/></svg>
          <span>出征</span>
        </button>
        <button type="button" class="bottom-tab-btn" data-bottom-nav="supply-workshop">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M14.7 6.3a1 1 0 0 0 0 1.4l1.6 1.6a1 1 0 0 0 1.4 0l3.77-3.77a6 6 0 0 1-7.94 7.94l-6.91 6.91a2.12 2.12 0 0 1-3-3l6.91-6.91a6 6 0 0 1 7.94-7.94l-3.76 3.76z"/></svg>
          <span>工坊</span>
        </button>
        <button type="button" class="bottom-tab-btn" data-bottom-nav="port-facilities-hub">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 21h18"/><path d="M5 21V7l8-4v18"/><path d="M19 21V11l-6-4"/><path d="M9 9v.01"/><path d="M9 12v.01"/><path d="M9 15v.01"/></svg>
          <span>设施</span>
        </button>
      </nav>
    </footer>
  </div>

  <!-- Centered Frosted-Glass Tactical Modal (Theme / Save Vault / System Tools) -->
  <div id="sheet-backdrop" class="sheet-backdrop uikit-tactical-backdrop is-shell-tactical" hidden>
    <section
      id="sheet-dialog"
      class="sheet-dialog uikit-tactical-modal is-shell-tactical"
      role="dialog"
      aria-modal="true"
      aria-labelledby="sheet-title"
    >
      <header class="sheet-header uikit-tactical-header">
        <h2 id="sheet-title" class="sheet-title uikit-tactical-title">设置</h2>
        <button type="button" id="btn-sheet-close" class="btn-icon-close" aria-label="关闭弹窗">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true">
            <path d="M18 6 6 18"/>
            <path d="m6 6 12 12"/>
          </svg>
        </button>
      </header>
      <div id="sheet-body" class="sheet-body uikit-tactical-body"></div>
    </section>
  </div>

  <!-- Top Slide-Down Auto-Fade Toast Region -->
  <div id="toast-region" class="toast-region" aria-live="polite" aria-atomic="true"></div>

  <!-- Early Boot Error Guard (catches module load, syntax, and uncaught runtime errors before main.js runs) -->
  <script>
    (function () {
      function formatErrorDetail(err, source, lineno, colno) {
        if (!err) return '未知运行时异常';
        if (typeof err === 'string') return err;
        var msg = err.message || String(err);
        var loc = source ? ' @ ' + String(source).split('/').slice(-2).join('/') + (lineno ? ':' + lineno + (colno ? ':' + colno : '') : '') : '';
        var stackLine = '';
        if (!loc && err.stack) {
          var lines = String(err.stack).split('\n').map(function (s) { return s.trim(); }).filter(Boolean);
          stackLine = lines.length > 1 ? ' (' + lines[1].slice(0, 120) + ')' : '';
        }
        return msg + loc + stackLine;
      }

      function safeResetAndReload() {
        try { localStorage.clear(); } catch (e) {}
        try { sessionStorage.clear(); } catch (e) {}
        var tasks = [];
        try {
          if (window.indexedDB) {
            if (typeof indexedDB.databases === 'function') {
              tasks.push(
                indexedDB.databases().then(function (dbs) {
                  return Promise.all((dbs || []).map(function (db) {
                    if (!db || !db.name) return Promise.resolve();
                    return new Promise(function (resolve) {
                      var req = indexedDB.deleteDatabase(db.name);
                      req.onsuccess = req.onerror = req.onblocked = function () { resolve(); };
                    });
                  }));
                }).catch(function () {})
              );
            } else {
              tasks.push(new Promise(function (resolve) {
                var req = indexedDB.deleteDatabase('modular-pwa-base-db');
                req.onsuccess = req.onerror = req.onblocked = function () { resolve(); };
              }));
            }
          }
        } catch (e) {}
        try {
          if ('caches' in window) {
            tasks.push(
              caches.keys().then(function (keys) {
                return Promise.all(keys.map(function (k) { return caches.delete(k); }));
              }).catch(function () {})
            );
          }
          if ('serviceWorker' in navigator) {
            tasks.push(
              navigator.serviceWorker.getRegistrations().then(function (regs) {
                return Promise.all(regs.map(function (r) { return r.unregister(); }));
              }).catch(function () {})
            );
          }
        } catch (e) {}
        Promise.all(tasks).finally(function () {
          location.reload();
        });
      }

      function showBootError(err, label, source, lineno, colno) {
        var detail = formatErrorDetail(err, source, lineno, colno);
        var banner = document.getElementById('boot-error-banner');
        if (!banner) {
          banner = document.createElement('div');
          banner.id = 'boot-error-banner';
          banner.setAttribute('role', 'alert');
          banner.style.cssText =
            'position:fixed;top:0;left:0;right:0;z-index:99999;background:#7f1d1d;color:#fef2f2;' +
            'border-bottom:2px solid #f87171;padding:12px 14px;font-family:system-ui,-apple-system,sans-serif;' +
            'font-size:13px;line-height:1.45;box-shadow:0 8px 24px rgba(0,0,0,0.45);';
          var titleEl = document.createElement('div');
          titleEl.id = 'boot-error-title';
          titleEl.style.cssText = 'font-weight:800;margin-bottom:4px;color:#fecaca;';
          var msgEl = document.createElement('div');
          msgEl.id = 'boot-error-msg';
          msgEl.style.cssText = 'word-break:break-word;font-family:ui-monospace,monospace;font-size:12px;margin-bottom:10px;';
          var btnRow = document.createElement('div');
          btnRow.style.cssText = 'display:flex;gap:8px;flex-wrap:wrap;';
          var resetBtn = document.createElement('button');
          resetBtn.type = 'button';
          resetBtn.id = 'btn-boot-safe-reset';
          resetBtn.textContent = '安全重置本地数据并重载';
          resetBtn.style.cssText =
            'min-height:36px;padding:6px 12px;border-radius:8px;border:1px solid #fca5a5;' +
            'background:#dc2626;color:#fff;font-weight:700;font-size:12px;cursor:pointer;';
          resetBtn.addEventListener('click', safeResetAndReload);
          var closeBtn = document.createElement('button');
          closeBtn.type = 'button';
          closeBtn.textContent = '关闭提示';
          closeBtn.style.cssText =
            'min-height:36px;padding:6px 12px;border-radius:8px;border:1px solid rgba(254,202,202,0.5);' +
            'background:transparent;color:#fef2f2;font-size:12px;cursor:pointer;';
          closeBtn.addEventListener('click', function () { banner.remove(); });
          btnRow.appendChild(resetBtn);
          btnRow.appendChild(closeBtn);
          banner.appendChild(titleEl);
          banner.appendChild(msgEl);
          banner.appendChild(btnRow);
          (document.body || document.documentElement).prepend(banner);
        }
        var tEl = document.getElementById('boot-error-title');
        var mEl = document.getElementById('boot-error-msg');
        if (tEl) tEl.textContent = '⚠ ' + (label || '启动或运行异常');
        if (mEl) mEl.textContent = detail;
      }

      window.__SHOW_BOOT_ERROR__ = showBootError;
      window.addEventListener('error', function (ev) {
        showBootError(ev.error || ev.message || '脚本加载或执行错误', '全局运行时错误', ev.filename, ev.lineno, ev.colno);
      });
      window.addEventListener('unhandledrejection', function (ev) {
        showBootError(ev.reason || '未处理的异步异常', '异步初始化异常');
      });
    })();
  </script>

  <script type="module" src="./src/main.js"></script>
</body>
</html>
